[test]
coverage = true
coverageThreshold = 1
coverageReporter = ["lcov", "text"]
coveragePathIgnorePatterns = "src/numericQuantityTests.ts"

[fmt]
flavor = "oxfmt"
printWidth = 100
tabWidth = 2
useTabs = false
semi = true
singleQuote = true
trailingComma = "es5"
bracketSpacing = true
bracketSameLine = true
arrowParens = "avoid"
embeddedLanguageFormatting = "auto"
sortPackageJson = false
sortImports = { newlinesBetween = false }
